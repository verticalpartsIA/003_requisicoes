name: Deploy — Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Corrige e valida app no servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          port: 65002
          command_timeout: 15m
          script: |
            D=$HOME/domains/vprequisicoes.vpsistema.com
            NODE=/opt/alt/alt-nodejs22/root/bin/node
            cd $D/nodejs
            export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH
            echo "=== atualiza codigo ==="
            git fetch origin main && git reset --hard origin/main
            echo "=== symlink .env de runtime (vars do painel) ==="
            ln -sfn $D/public_html/.builds/config/.env $D/nodejs/.env && ls -la .env || true
            echo "=== instala dependencias ==="
            npm ci || npm install
            echo "=== builda o front (dist/ nao vai pro git, precisa gerar aqui) ==="
            BUILD_FAILED=0
            npm run build || BUILD_FAILED=1
            if [ "$BUILD_FAILED" = "1" ]; then
              echo "!!! BUILD FALHOU — dist/ anterior foi restaurado automaticamente (scripts/build.mjs), app continua servindo a versao anterior."
            fi
            echo "=== valida require(server.js) como o Passenger faz ==="
            if PORT=3199 timeout 15 $NODE -e "require('./server.js'); setTimeout(() => process.exit(0), 3000);" > /tmp/vpreq-req.log 2>&1; then
              echo "REQUIRE OK — server.js compativel com Passenger"
              cat /tmp/vpreq-req.log
            else
              echo "REQUIRE FALHOU — aplicando fallback boot.cjs no htaccess:"
              cat /tmp/vpreq-req.log
              sed -i 's/^PassengerStartupFile .*/PassengerStartupFile boot.cjs/' $D/public_html/.htaccess
            fi
            grep Passenger $D/public_html/.htaccess || true
            echo "=== diagnostico: hbuilds/current aponta pra onde? ==="
            readlink -f "$D/hbuilds/current" 2>&1 || echo "hbuilds/current: nao existe ou nao e symlink"
            ls -la "$D/hbuilds" 2>&1 || echo "hbuilds: diretorio nao existe"
            echo "-- comparando dist/server/index.js: nodejs/ vs hbuilds/current/nodejs/ --"
            stat -c '%Y %n' "$D/nodejs/dist/server/index.js" 2>&1 || echo "nodejs/dist/server/index.js: nao existe"
            stat -c '%Y %n' "$D/hbuilds/current/nodejs/dist/server/index.js" 2>&1 || echo "hbuilds/current/nodejs/dist/server/index.js: nao existe"
            echo "-- console.log de hbuilds/current/nodejs (app real que o Passenger serve) --"
            tail -c 3000 "$D/hbuilds/current/nodejs/console.log" 2>&1 || echo "sem console.log em hbuilds/current/nodejs"
            echo "-- arquivos de log recentes em hbuilds/logs --"
            find "$D/hbuilds/logs" -type f -mmin -30 2>&1 | head -20
            echo "=== reinicia app ==="
            mkdir -p tmp && touch tmp/restart.txt
            sleep 5
            echo "=== testa site pelo dominio ==="
            curl -s -w "\nGET /login => %{http_code}\n" --max-time 40 https://vprequisicoes.vpsistema.com/login 2>&1 | tail -c 2000 || true
            echo "=== console.log do app ==="
            tail -c 1500 console.log 2>/dev/null || echo "(vazio)"
            echo "=== FIM ==="
            if [ "$BUILD_FAILED" = "1" ]; then
              echo "!!! Marcando job como falho: build desta versao nao foi publicado (versao anterior continua no ar)."
              exit 1
            fi
